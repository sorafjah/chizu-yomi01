<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地図を読もう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F0; --panel:#FFFFFF; --ink:#22302B; --sub:#5A6862; --line:#C9D3CE;
  --accent:#2465A0; --accent-weak:#E1ECF6;
  --ok:#2C7A4B; --ok-weak:#E3F3E8; --ng:#A9532F; --ng-weak:#FAEBE2;
  --hl:#E8770F; --hl-weak:#FFE6C9;
  --font:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;overflow:hidden;-webkit-tap-highlight-color:transparent}
rt{font-size:.5em;font-weight:400;line-height:1}
button{font-family:var(--font);color:var(--ink);touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* ボタン */
.btn{min-height:56px;min-width:56px;padding:6px 26px;border-radius:14px;border:2px solid var(--accent);
  background:var(--panel);color:var(--accent);font-size:22px;font-weight:700;line-height:1.8}
.btn.primary{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.iconbtn{min-width:52px;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--panel);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:17px;font-weight:700;padding:0 12px;line-height:1.7}

/* スタート */
#start{align-items:center;justify-content:center;overflow:auto}
.topright{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);display:flex;gap:10px}
.startcard{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px;text-align:center;max-width:680px}
.startcard h1{margin:0;font-size:clamp(38px,7vw,58px);letter-spacing:.06em;line-height:1.6}
.startcard .lead{font-size:21px;line-height:2;margin:0;color:var(--sub)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 16px;font-size:18px;font-weight:700;line-height:1.9}
.startillust{width:min(380px,80vw);height:auto}
.startcard .btn.primary{font-size:28px;padding:8px 56px}

/* 問題画面 */
#quiz header{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--panel);border-bottom:2px solid var(--line);flex:none}
#quiz header .prog{font-size:20px;font-weight:700;line-height:1.8}
#quiz header .mapno{font-size:16px;color:var(--sub);line-height:1.8}
#quiz header .sp{flex:1}
#quiz main{flex:1;display:flex;min-height:0}
.mapside{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;padding:10px;gap:8px}
.mapbox{flex:1 1 auto;width:100%;min-height:0;display:flex;justify-content:center;align-items:flex-start}
.mapframe{position:relative;overflow:hidden;border:2px solid #333;background:#fff;flex:none}
.mapcanvas{position:absolute;left:0;top:0;width:1000px;height:840px;transform-origin:0 0}
.mapcanvas svg{position:absolute;left:0;top:0}
.mapcanvas .labs,.mapcanvas .ovh{position:absolute;inset:0}
.mapcanvas svg.ov,.mapcanvas .ovh{pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:15px;line-height:1.9;max-width:100%}
.legend .li{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;padding:0 4px;border-radius:6px}
.legend .li.hl{background:var(--hl-weak);outline:3px solid var(--hl)}
.legend svg{flex:none}

.qside{width:clamp(320px,34vw,450px);flex:none;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border-left:2px solid var(--line);padding:14px 16px 28px}
.qkind{display:inline-block;font-size:15px;font-weight:700;color:var(--accent);background:var(--accent-weak);border-radius:999px;padding:0 12px;line-height:2}
.qtext{font-size:21px;line-height:2.05;margin:8px 0 10px}
.qtext .opt{display:block;padding-left:1.2em;text-indent:-1.2em}
.qextra{display:flex;justify-content:center;margin:4px 0 10px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.answers.one{grid-template-columns:1fr}
.choice{min-height:58px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:700;line-height:1.8;padding:4px 10px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.answers.one .choice{justify-content:flex-start;text-align:left;font-weight:400;font-size:19px}
.choice.sel{border-color:var(--accent);background:var(--accent-weak);outline:2px solid var(--accent)}
.choice.right{border-color:var(--ok);background:var(--ok-weak);outline:2px solid var(--ok)}
.choice.wrong{border-color:var(--ng);background:var(--ng-weak)}
.choice .mk{flex:none;font-weight:700;min-width:1.6em}
.choice:disabled{cursor:default;color:var(--ink);opacity:1}
.numrow{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 16px;flex-wrap:wrap}
.numrow .step{width:60px;height:60px;border-radius:12px;border:2px solid var(--accent);background:#fff;color:var(--accent);font-size:26px;font-weight:700;line-height:1}
.numrow input{width:120px;height:60px;border-radius:12px;border:2px solid var(--line);text-align:center;font-size:30px;font-weight:700;font-family:var(--font);color:var(--ink);-webkit-user-select:text;user-select:text}
.numrow .unit{font-size:22px;font-weight:700}
.actrow{display:flex;justify-content:center}
.feedback{margin-top:14px;border-radius:14px;padding:12px 14px;border:2px solid var(--line)}
.feedback.ok{background:var(--ok-weak);border-color:var(--ok)}
.feedback.ng{background:var(--ng-weak);border-color:var(--ng)}
.verdict{font-size:24px;font-weight:700;line-height:1.9}
.feedback.ok .verdict{color:var(--ok)}
.feedback.ng .verdict{color:var(--ng)}
.explain{font-size:19px;line-height:2;margin-top:6px;background:#fff;border-radius:10px;padding:8px 12px}
.explain b{color:#B65A08}
.orient{display:flex;justify-content:center;margin-top:8px}
.feedback .actrow{margin-top:12px}

/* 地図の文字 */
.lab{position:absolute;white-space:nowrap;display:flex;align-items:flex-end;line-height:1.15;font-size:19px;padding:0 2px 3px;border-radius:6px}
.lab.stop{font-size:20px;font-weight:700}
.lab.right{justify-content:flex-end}
.lab.park{font-weight:700;align-items:center}
.lab.hl{background:var(--hl-weak);box-shadow:0 0 0 3px var(--hl)}
.station{position:absolute;transform:translate(-50%,-50%);border:2.5px solid #222;background:#fff;font-weight:700;font-size:20px;line-height:1.2;padding:3px 10px 4px;white-space:nowrap}
.station.v{display:flex;flex-direction:column;align-items:center;padding:6px 13px 6px 5px;line-height:1.12}
.station.v .vc{position:relative;display:block}
.station.v .vr{position:absolute;left:100%;top:0;font-size:10px;font-weight:400;writing-mode:vertical-rl;line-height:1;margin-left:1px}
.station.hl{background:var(--hl-weak);box-shadow:0 0 0 3px var(--hl)}
.otag{position:absolute;transform:translate(-50%,-50%);background:#fff;border:3px solid var(--hl);color:#9A4A00;border-radius:12px;padding:0 8px;font-size:21px;font-weight:700;line-height:1.3;white-space:nowrap}
.otag.big{font-size:26px;padding:2px 10px}
.otag.dark{border-color:#333;color:#222}
.mapcanvas.dimbus .bus{opacity:.25}

/* 結果 */
#result{align-items:center;overflow:auto}
.rescard{width:min(720px,94vw);margin:28px auto;background:var(--panel);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:14px}
.rescard h2{margin:0;font-size:34px;line-height:1.7}
.score{font-size:30px;font-weight:700;line-height:1.8}
.reslist{width:100%;display:grid;grid-template-columns:1fr;gap:6px}
.resrow{display:flex;align-items:center;gap:12px;font-size:19px;line-height:1.9;padding:4px 12px;border-radius:10px;background:#F6F8F7}
.resrow .m{font-weight:700;min-width:6.5em}
.resrow.ok .m{color:var(--ok)}
.resrow.ng .m{color:var(--ng)}
.resbtns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* モーダル */
.modal{position:fixed;inset:0;background:rgba(20,30,26,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.mbox{background:var(--panel);border-radius:18px;padding:20px 22px;width:min(640px,96vw);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.mbox h3{margin:0;font-size:26px;line-height:1.8}
.mbox p,.mbox li{font-size:19px;line-height:2;margin:0}
.mbox ol{margin:0;padding-left:1.4em}
.mbox .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mbox .lbl{font-size:18px;font-weight:700;min-width:5em}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:48px;min-width:56px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:18px;font-weight:700;padding:0 14px}
.seg button.on{border-color:var(--accent);background:var(--accent);color:#fff}
.lvdesc{font-size:16px;color:var(--sub);line-height:1.7}
.chk{display:flex;align-items:center;gap:10px;font-size:18px;min-height:48px}
.chk input{width:28px;height:28px}
.mbtns{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:52px;height:52px;border-radius:10px;border:2px solid var(--accent);background:#fff;color:var(--accent);font-size:22px;font-weight:700}
.stepper input{width:80px;height:52px;border-radius:10px;border:2px solid var(--line);text-align:center;font-size:24px;font-weight:700;font-family:var(--font);-webkit-user-select:text;user-select:text}

/* 拡大 */
#zoom{position:fixed;inset:0;background:#fff;z-index:40;display:flex;flex-direction:column}
#zoom .zbar{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);border-bottom:2px solid var(--line);flex:none}
#zoom .zbar .sp{flex:1}
#zoom .zscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
#zoom .zframe{position:relative;margin:10px}

@media (max-aspect-ratio:1/1){
  #quiz main{flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .mapside{flex:none}
  .mapbox{flex:none}
  .qside{width:auto;border-left:0;border-top:2px solid var(--line);overflow:visible;flex:none}
}
@media (max-width:520px){
  .qtext{font-size:19px}
  .choice{font-size:18px}
  #quiz header .mapno{display:none}
  .iconbtn{font-size:15px;padding:0 8px}
}
</style>
</head>
<body>

<!-- スタート画面 -->
<section id="start" class="screen">
  <div class="topright">
    <button class="iconbtn" id="btnHelp"></button>
    <button class="iconbtn" id="btnSettings" aria-label="設定">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#22302B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div class="startcard">
    <h1 id="ttl"></h1>
    <svg class="startillust" viewBox="0 0 380 200" aria-hidden="true">
      <rect x="0" y="0" width="380" height="200" rx="16" fill="#fff" stroke="#C9D3CE" stroke-width="2"/>
      <path d="M0,34H380" stroke="#222" stroke-width="7"/><path d="M0,34H380" stroke="#fff" stroke-width="3.5" stroke-dasharray="12 12"/>
      <g fill="#D3D3D3"><rect x="60" y="54" width="14" height="130"/><rect x="180" y="54" width="14" height="130"/><rect x="300" y="54" width="14" height="130"/><rect x="40" y="62" width="300" height="14"/><rect x="40" y="120" width="300" height="14"/><rect x="40" y="170" width="300" height="12"/></g>
      <path d="M67,69H307V127H187" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="0.1 9" stroke-linecap="round"/>
      <path d="M232,62l10,7l-10,7z" fill="#333"/>
      <circle cx="120" cy="98" r="9" fill="#fff" stroke="#222" stroke-width="2.4"/><path d="M115,94H125M115,97.5H125M120,97.5V104" stroke="#222" stroke-width="2.2" fill="none"/>
      <text x="246" y="106" font-size="22" font-weight="700" text-anchor="middle" font-family="BIZ UDPGothic,sans-serif" fill="#222">文</text>
      <circle cx="120" cy="153" r="9" fill="#fff" stroke="#222" stroke-width="2.4"/><circle cx="120" cy="153" r="4.5" fill="none" stroke="#222" stroke-width="2.4"/>
      <g transform="translate(350,110)"><text y="-28" font-size="15" font-weight="700" text-anchor="middle" font-family="sans-serif" fill="#222">N</text><path d="M0,-22V26" stroke="#222" stroke-width="2.5"/><path d="M0,-22L-8,0L0,-4Z" fill="#222"/></g>
    </svg>
    <p class="lead" id="lead"></p>
    <div class="chips" id="chips"></div>
    <button class="btn primary" id="btnStart">はじめる</button>
  </div>
</section>

<!-- 問題画面 -->
<section id="quiz" class="screen" hidden>
  <header>
    <span class="prog" id="prog"></span>
    <span class="mapno" id="mapno"></span>
    <span class="sp"></span>
    <button class="iconbtn" id="btnZoom"></button>
    <button class="iconbtn" id="btnQuit">やめる</button>
  </header>
  <main id="qmain">
    <div class="mapside">
      <div class="mapbox" id="mapbox"><div class="mapframe" id="mapframe"><div class="mapcanvas" id="mapcanvas"></div></div></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="qside" id="qside">
      <span class="qkind" id="qkind"></span>
      <div class="qtext" id="qtext"></div>
      <div class="qextra" id="qextra"></div>
      <div class="answers" id="answers"></div>
      <div class="actrow"><button class="btn primary" id="btnAnswer">こたえる</button></div>
      <div class="feedback" id="feedback" hidden>
        <div class="verdict" id="verdict"></div>
        <div class="explain" id="explain"></div>
        <div class="orient" id="orient"></div>
        <div class="actrow"><button class="btn primary" id="btnNext">つぎへ</button></div>
      </div>
    </div>
  </main>
</section>

<!-- 結果画面 -->
<section id="result" class="screen" hidden>
  <div class="rescard">
    <h2 id="resTitle"></h2>
    <div class="score" id="score"></div>
    <div class="reslist" id="reslist"></div>
    <div class="resbtns">
      <button class="btn primary" id="btnAgain">もういちど</button>
      <button class="btn" id="btnHome">はじめにもどる</button>
    </div>
  </div>
</section>

<!-- 拡大 -->
<div id="zoom" hidden>
  <div class="zbar">
    <button class="iconbtn" id="zOut" aria-label="小さく">－</button>
    <button class="iconbtn" id="zIn" aria-label="大きく">＋</button>
    <span class="sp"></span>
    <button class="iconbtn" id="zClose">とじる</button>
  </div>
  <div class="zscroll" id="zscroll"><div class="zframe" id="zframe"></div></div>
</div>

<!-- 使い方 -->
<div class="modal" id="mHelp" hidden>
  <div class="mbox">
    <h3 id="helpTtl"></h3>
    <ol id="helpList"></ol>
    <label class="chk"><input type="checkbox" id="chkNoHelp"><span id="noHelpTxt"></span></label>
    <div class="mbtns"><button class="btn primary" id="btnHelpClose">とじる</button></div>
  </div>
</div>

<!-- 設定（教員） -->
<div class="modal" id="mSettings" hidden>
  <div class="mbox">
    <h3>設定</h3>
    <div>
      <div class="row"><span class="lbl">レベル</span><div class="seg" id="segLevel"></div></div>
      <div class="lvdesc" id="lvdesc"></div>
    </div>
    <div class="row"><span class="lbl">問題数</span>
      <div class="stepper"><button id="cntDown" aria-label="減らす">▽</button><input id="cntInput" inputmode="numeric"><button id="cntUp" aria-label="増やす">△</button></div>
      <span style="font-size:16px;color:var(--sub)">4〜20問（地図1枚につき4問）</span>
    </div>
    <div class="row"><span class="lbl">効果音</span><div class="seg" id="segSound"><button data-v="1">ON</button><button data-v="0">OFF</button></div></div>
    <div class="mbtns"><button class="btn primary" id="btnSetClose">とじる</button></div>
  </div>
</div>

<!-- やめる確認 -->
<div class="modal" id="mQuit" hidden>
  <div class="mbox" style="width:min(460px,94vw);align-items:center;text-align:center">
    <h3>とちゅうで やめる？</h3>
    <div class="mbtns" style="justify-content:center">
      <button class="btn" id="btnQuitNo">つづける</button>
      <button class="btn primary" id="btnQuitYes">やめる</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ====================== 共通 ====================== */
const $=s=>document.querySelector(s);
const R=s=>String(s).replace(/\{([^|{}]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample=(a,n)=>shuffle(a).slice(0,n);
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const Q=s=>'「'+s+'」';
/* 「分」のふりがな（〇分 の読み） */
const FUN=n=>{const d=n%10;return n+(([1,3,4,6,8,0].includes(d))?'{分|ぷん}':'{分|ふん}');};

const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
const KEY_SET='chizuyomi01_settings', KEY_HELP='chizuyomi01_nohelp';
const settings=Object.assign({level:1,count:8,sound:true},store.get(KEY_SET,{}));

/* 効果音 */
let actx=null;
function unlockAudio(){
  try{
    if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC();}
    if(actx&&actx.state==='suspended')actx.resume();
  }catch(e){}
}
function tone(seq,type,vol){
  if(!settings.sound||!actx)return;
  try{
    let t=actx.currentTime+0.02;
    for(const [f,d] of seq){
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.02);t+=d*0.85;
    }
  }catch(e){}
}
const sndOK=()=>tone([[784,.16],[1175,.3]],'sine',.22);
const sndNG=()=>tone([[392,.28]],'triangle',.12);

/* ====================== 地図の定数 ====================== */
const MW=1000, MH=840;
const GX=[60,280,500,720,940], GY=[140,298,456,614,772];
const RW=26, RAILY=80, RAILX=978, ROAD='#D2D2D2';
const XY=ij=>[GX[ij[0]],GY[ij[1]]];

const PREFIX=['さくら','もみじ','あおば','みどり','つばき','すみれ','かえで','ひかり','あさひ','わかば','いずみ','はるか',
  'ひまわり','なのはな','あじさい','たんぽぽ','やまぶき','れんげ','ききょう','ほたる','かもめ','つばめ','ひばり','すずらん',

  museum:{n:'{美術館|びじゅつかん}',sym:'dot'},

};
const SYMS={post:'{郵便局|ゆうびんきょく}',school:'{学校|がっこう}',hschool:'{高校|こうこう}',hospital:'{病院|びょういん}',
  police:'{警察署|けいさつしょ}',fire:'{消防署|しょうぼうしょ}',cityhall:'{市役所|しやくしょ}',library:'{図書館|としょかん}',shrine:'{神社|じんじゃ}'};
const SYMORDER=['cityhall','post','school','hschool','hospital','police','fire','library','shrine'];
const DIR8=['{東|ひがし}','{北東|ほくとう}','{北|きた}','{北西|ほくせい}','{西|にし}','{南西|なんせい}','{南|みなみ}','{南東|なんとう}'];
const D4={E:{n:'{東|ひがし}',v:[1,0]},W:{n:'{西|にし}',v:[-1,0]},S:{n:'{南|みなみ}',v:[0,1]},N:{n:'{北|きた}',v:[0,-1]}};
const d4name=(dx,dy)=>dx>0?D4.E.n:dx<0?D4.W.n:dy>0?D4.S.n:D4.N.n;

/* 文字幅の見積もり（ルビも考える） */
function cw(s){let w=0;for(const ch of s)w+=/[\x20-\x7e]/.test(ch)?0.58:1;return w;}
function textW(m,fs){
  let w=0;const re=/\{([^|{}]+)\|([^{}]+)\}|([^{])/g;let mm;
  while((mm=re.exec(m))){if(mm[1])w+=Math.max(cw(mm[1]),cw(mm[2])*0.5);else w+=cw(mm[3]);}
  return w*fs;
}
const over=(a,b)=>!(a.x+a.w<=b.x||b.x+b.w<=a.x||a.y+a.h<=b.y||b.y+b.h<=a.y);
const overArea=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));

function sym(k,x,y,sc,col){
  sc=sc||1;col=col||'#222';
  const g=inner=>`<g transform="translate(${x},${y}) scale(${sc})" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${inner}</g>`;
  const bg='<circle r="13" fill="#fff" stroke="none"/>';
  switch(k){
    case 'post':return g('<circle r="12" fill="#fff"/><path d="M-6.5,-6H6.5M-6.5,-1.5H6.5M0,-1.5V8"/>');
    case 'school':return g(`<rect x="-13" y="-13" width="26" height="26" fill="#fff" stroke="none"/><text x="0" y="8.5" text-anchor="middle" font-size="24" font-weight="700" fill="${col}" stroke="none" font-family="BIZ UDPGothic,sans-serif">文</text>`);
    case 'hschool':return g(`<circle r="13" fill="#fff"/><text x="0" y="6.2" text-anchor="middle" font-size="17" font-weight="700" fill="${col}" stroke="none" font-family="BIZ UDPGothic,sans-serif">文</text>`);
    case 'hospital':return g('<path d="M-11,-11H11V1Q11,10 0,12.5Q-11,10 -11,1Z" fill="#fff"/><path d="M0,-7V6M-6.5,-0.5H6.5"/>');
    case 'police':return g('<circle r="12" fill="#fff"/><path d="M-7,-7L7,7M7,-7L-7,7"/>');
    case 'fire':return g(bg+'<path d="M0,12V0M-10,-11Q-10,0 0,0Q10,0 10,-11"/>');
    case 'cityhall':return g('<circle r="12" fill="#fff"/><circle r="5.5"/>');
    case 'library':return g(bg+'<path d="M0,-5Q-6,-10 -12,-8V8Q-6,6 0,10Q6,6 12,8V-8Q6,-10 0,-5ZM0,-5V10" fill="#fff"/>');
    case 'shrine':return g(bg+'<path d="M-12,-9Q0,-12 12,-9M-9,-3.5H9M-6,-9V11M6,-9V11"/>');
    case 'dot':return `<circle cx="${x}" cy="${y}" r="${6.5*sc}" fill="${col}"/>`;
  }
  return '';
}
function busIcon(x,y,col){
  col=col||'#222';
  return `<g transform="translate(${x},${y})"><rect x="-13" y="-15" width="26" height="30" rx="5" fill="#fff" stroke="${col}" stroke-width="2.4"/>
  <rect x="-8.5" y="-10" width="17" height="15" rx="2.5" fill="${col}"/><rect x="-6.5" y="-8" width="13" height="5.5" fill="#fff"/>
  <circle cx="-4.5" cy="8.5" r="2.3" fill="${col}"/><circle cx="4.5" cy="8.5" r="2.3" fill="${col}"/></g>`;
}
const symMini=(k,size)=>`<svg width="${size}" height="${size}" viewBox="-16 -16 32 32" aria-hidden="true">${sym(k,0,0,1)}</svg>`;

/* ====================== 地図をつくる ====================== */
let mapUid=0;
function genMap(){
  for(let t=0;t<400;t++){const m=tryMap();if(m)return m;}
  throw new Error('map');
}
function tryMap(){
  const M={uid:++mapUid,facs:[],stops:[],boxes:[],byBlock:{}};
  const pre=shuffle(PREFIX);let pi=0;const np=()=>pre[pi++];

  /* バスの通る道（1方向に回る） */
  let a=pick([0,1]),b=pick([3,4]);
  if(a===0&&b===4){if(Math.random()<.5)a=1;else b=3;}
  const notch=Math.random()<.55?pick([1,2]):0;
  const V=[[a,0],[4,0],[4,b]];
  if(notch&&a+1<4&&b-notch>0)V.push([a+1,b],[a+1,b-notch],[a,b-notch]);else V.push([a,b]);
  let pts=[];
  for(let k=0;k<V.length;k++){
    const p=V[k],q=V[(k+1)%V.length];const di=Math.sign(q[0]-p[0]),dj=Math.sign(q[1]-p[1]);
    const c=[p[0],p[1]];while(c[0]!==q[0]||c[1]!==q[1]){pts.push(c.slice());c[0]+=di;c[1]+=dj;}
  }
  if(Math.random()<.5)pts.reverse();
  M.pts=pts;const NP=pts.length;

  /* 施設の種類をブロックにわりあてる */
  const blocks=[];for(let r=0;r<4;r++)for(let c=0;c<4;c++)blocks.push([c,r]);
  const sb=shuffle(blocks);
  const types=[];
  for(let i=0,n=2+rnd(2);i<n;i++)types.push('post');
  types.push('eschool');if(Math.random()<.5)types.push('eschool');types.push('jschool');
  types.push('hospital');if(Math.random()<.35)types.push('hospital');
  types.push('police','fire','cityhall','library');
  if(Math.random()<.5)types.push('shrine');
  if(Math.random()<.45)types.push('hschool');
  const dots=shuffle(['bank','super','shokudo','bakery','museum','cinema','kinder']);let di=0;
  while(types.length<15)types.push(dots[di++]);
  const tps=shuffle(types);
  sb.forEach(([c,r],k)=>{
    const type=k===0?'park':tps[k-1];
    const f={id:'f'+k,type,c,r,name:TYPES[type].solo?TYPES[type].n:np()+TYPES[type].n};
    M.facs.push(f);M.byBlock[c+','+r]=f;
  });

  /* 駅 */
  const segIdx=(p,q)=>{for(let k=0;k<NP;k++){const u=pts[k],v=pts[(k+1)%NP];
    if((u[0]===p[0]&&u[1]===p[1]&&v[0]===q[0]&&v[1]===q[1])||(u[0]===q[0]&&u[1]===q[1]&&v[0]===p[0]&&v[1]===p[1]))return k;}return -1;};
  const iA=a+rnd(4-a), jB=rnd(b);
  const segA=segIdx([iA,0],[iA+1,0]), segB=segIdx([4,jB],[4,jB+1]);
  if(segA<0||segB<0)return null;
  const stA={id:'A',pre:np()},stB={id:'B',pre:np()};
  stA.name=stA.pre+'{駅|えき}';stB.name=stB.pre+'{駅|えき}';

  /* バス停の場所 */
  const want=NP>=13?7:6;
  const segs=[segA,segB];
  for(const k of shuffle([...Array(NP).keys()])){if(segs.length>=want)break;if(!segs.includes(k))segs.push(k);}
  /* 名前 */
  const usedNear=new Set();
  const stopName=k=>{
    if(k===segA)return stA.pre+'{駅前|えきまえ}';
    if(k===segB)return stB.pre+'{駅前|えきまえ}';
    const adj=segBlocks(pts[k],pts[(k+1)%NP]).map(([c,r])=>M.byBlock[c+','+r]).filter(Boolean);
    for(const f of shuffle(adj)){
      if(usedNear.has(f.type)||Math.random()<.35)continue;
      if(f.type==='cityhall'){usedNear.add(f.type);return '{市役所前|しやくしょまえ}';}
      if(f.type==='library'){usedNear.add(f.type);return '{図書館前|としょかんまえ}';}
      if(f.type==='park'){usedNear.add(f.type);return '{公園入口|こうえんいりぐち}';}
      if(f.type==='hospital'){usedNear.add(f.type);return f.name+'{前|まえ}';}
    }
    return np()+(1+rnd(4))+'{丁目|ちょうめ}';
  };
  M.boxes.push({x:0,y:0,w:62,h:66});/* 方位記号 */
  for(const x of GX)M.boxes.push({x:x-RW/2,y:GY[0]-RW/2,w:RW,h:GY[4]-GY[0]+RW});
  for(const y of GY)M.boxes.push({x:GX[0]-RW/2,y:y-RW/2,w:GX[4]-GX[0]+RW,h:RW});
  let sid=0;
  for(const k of segs){
    const name=stopName(k);
    const cands=shuffle(stopCands(pts[k],pts[(k+1)%NP],name));
    let ok=null;
    for(const cd of cands){
      const ib={x:cd.ix-15,y:cd.iy-17,w:30,h:34};
      if(M.boxes.some(bx=>over(bx,ib)||over(bx,cd.lab)))continue;
      ok=cd;ok.ib=ib;break;
    }
    if(!ok){if(k===segA||k===segB)return null;continue;}
    const s={id:'s'+(sid++),name,seg:k,...ok};
    M.boxes.push(ok.ib,ok.lab);
    if(k===segA)stA.stop=s;if(k===segB)stB.stop=s;
    M.stops.push(s);
  }
  if(M.stops.length<6)return null;
  /* 駅の箱 */
  {
    const w=textW(stA.name,20)+26;stA.cx=stA.stop.rx;stA.cy=RAILY;
    stA.box={x:stA.cx-w/2,y:RAILY-22,w,h:44};
    const hb=(cw(stB.pre)+1)*24+34;stB.cx=RAILX;stB.cy=stB.stop.ry;
    stB.box={x:RAILX-23,y:stB.cy-hb/2,w:46,h:hb};
    if(stB.box.y<RAILY+20||stB.box.y+stB.box.h>MH-40)return null;
    if(M.boxes.some(bx=>over(bx,stA.box)))return null;
    M.boxes.push(stA.box,stB.box);
  }
  M.stations=[stA,stB];

  /* 施設の文字の場所 */
  for(const f of shuffle(M.facs)){
    const br=blockRect(f.c,f.r);
    const fs=19, isPark=f.type==='park';
    const w=(isPark?8:31)+textW(f.name,fs)*1.04+4, h=36;
    if(w>br.x1-br.x0)return null;
    if(isPark){
      /* 公園：ブロック全体を緑に。名前は上か下 */
      const cands=[];for(const x of [br.x0+4,(br.x0+br.x1-w)/2,br.x1-w-4])for(const y of [br.y0+4,br.y1-h-4])cands.push([x,y]);
      let best=null,bs=1e9;
      for(const [x,y] of shuffle(cands)){const bx={x,y,w,h};const sc=M.boxes.reduce((s,o)=>s+overArea(o,bx),0);if(sc<bs){bs=sc;best=bx;}}
      if(bs>0)return null;
      f.box=best;f.sx=(br.x0+br.x1)/2;f.sy=(br.y0+br.y1)/2;M.boxes.push(best);continue;
    }
    const xs=[br.x0,(br.x0+br.x1-w)/2,br.x1-w], ys=[br.y0,(br.y0+br.y1-h)/2,br.y1-h];
    const cands=[];for(const x of xs)for(const y of ys)cands.push({x,y,w,h});
    let best=null,bs=1e9;
    for(const bx of shuffle(cands)){const sc=M.boxes.reduce((s,o)=>s+overArea(o,bx),0);if(sc<bs){bs=sc;best=bx;}if(sc===0)break;}
    if(bs>0)return null;
    f.box=best;f.sx=best.x+14;f.sy=best.y+h-14;M.boxes.push(best);
  }

  /* バス停を進む順にならべる */
  for(const s of M.stops){
    const p=XY(pts[s.seg]),q=XY(pts[(s.seg+1)%NP]);
    const L=dist(p[0],p[1],q[0],q[1]);s.u=s.seg+dist(p[0],p[1],s.rx,s.ry)/L;
  }
  M.stops.sort((x,y)=>x.u-y.u);
  M.stops.forEach((s,i)=>s.idx=i);
  M.iA=stA.stop.idx;M.iB=stB.stop.idx;
  M.segMin=M.stops.map(()=>2+rnd(4));
  return M;
}
function blockRect(c,r){return{x0:GX[c]+RW/2+4,y0:GY[r]+RW/2+4,x1:GX[c+1]-RW/2-4,y1:GY[r+1]-RW/2-4};}
function segBlocks(p,q){
  const out=[];
  if(p[1]===q[1]){const i=Math.min(p[0],q[0]),j=p[1];if(j>0)out.push([i,j-1]);if(j<4)out.push([i,j]);}
  else{const j=Math.min(p[1],q[1]),i=p[0];if(i>0)out.push([i-1,j]);if(i<4)out.push([i,j]);}
  return out;
}
function stopCands(p,q,name){
  const lw=textW(name,20)*1.07+8, lh=36, res=[];
  if(p[1]===q[1]){
    const j=p[1],i=Math.min(p[0],q[0]);const sides=[];if(j>0)sides.push(-1);if(j<4)sides.push(1);
    for(const sd of sides)for(const end of [0,1]){
      const ix=end===0?GX[i]+32:GX[i+1]-32, iy=GY[j]+sd*33;
      const lx=end===0?ix+17:ix-17-lw;
      res.push({ix,iy,rx:ix,ry:GY[j],al:end===0?'l':'r',lab:{x:lx,y:iy-lh/2,w:lw,h:lh}});
    }
  }else{
    const i=p[0],j=Math.min(p[1],q[1]);const sides=[];if(i>0)sides.push(-1);if(i<4)sides.push(1);
    for(const sd of sides)for(const end of [0,1]){
      const ix=GX[i]+sd*32, iy=end===0?GY[j]+34:GY[j+1]-34;
      const lx=sd>0?ix+17:ix-17-lw;
      res.push({ix,iy,rx:GX[i],ry:iy,al:sd>0?'l':'r',lab:{x:lx,y:iy-lh/2,w:lw,h:lh}});
    }
  }
  return res;
}
/* バスの道にそった点 */
function loopPt(M,u){const n=M.pts.length;u=((u%n)+n)%n;const k=Math.floor(u),t=u-k;const a=XY(M.pts[k]),b=XY(M.pts[(k+1)%n]);return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}
function loopPath(M,u1,u2){const n=M.pts.length;if(u2<=u1)u2+=n;const out=[loopPt(M,u1)];for(let k=Math.floor(u1)+1;k<u2;k++)out.push(loopPt(M,k));out.push(loopPt(M,u2));return out;}
const fwd=(M,i,j)=>((j-i)%M.stops.length+M.stops.length)%M.stops.length;
const railPath=M=>{const A=M.stations[0],B=M.stations[1];return[[A.cx,RAILY],[RAILX,RAILY],[RAILX,B.cy]];};
function polyMid(pts){
  let L=0;for(let i=1;i<pts.length;i++)L+=dist(...pts[i-1],...pts[i]);
  let h=L/2;for(let i=1;i<pts.length;i++){const d=dist(...pts[i-1],...pts[i]);if(h<=d){const t=h/d;return[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t];}h-=d;}
  return pts[pts.length-1];
}

/* ====================== 地図をかく ====================== */
function baseSVG(M){
  let s=`<svg class="base" width="${MW}" height="${MH}" viewBox="0 0 ${MW} ${MH}" aria-hidden="true">`;
  s+=`<rect width="${MW}" height="${MH}" fill="#fff"/>`;
  /* 公園 */
  const pk=M.facs.find(f=>f.type==='park');
  if(pk){const br=blockRect(pk.c,pk.r);
    s+=`<rect x="${br.x0-2}" y="${br.y0-2}" width="${br.x1-br.x0+4}" height="${br.y1-br.y0+4}" rx="10" fill="#E2F0DC" stroke="#8DB585" stroke-width="2"/>`;
    const cx=(br.x0+br.x1)/2+(pk.box.y<(br.y0+br.y1)/2?0:0), cy=pk.box.y<(br.y0+br.y1)/2?br.y1-38:br.y0+38;
    s+=`<ellipse cx="${cx-30}" cy="${cy}" rx="40" ry="20" fill="#C9E2F2" stroke="#7FA9C4" stroke-width="2"/>`;
    for(const [tx,ty] of [[cx+40,cy-8],[cx+64,cy+6],[cx+30,cy+14]])s+=`<circle cx="${tx}" cy="${ty}" r="9" fill="#9CCB8E" stroke="#5E8F55" stroke-width="1.5"/>`;
  }
  /* 道 */
  const r0=GY[0]-RW/2,r1=GY[4]+RW/2,c0=GX[0]-RW/2,c1=GX[4]+RW/2;
  for(const x of GX)s+=`<rect x="${x-RW/2}" y="${r0}" width="${RW}" height="${r1-r0}" fill="${ROAD}"/>`;
  for(const y of GY)s+=`<rect x="${c0}" y="${y-RW/2}" width="${c1-c0}" height="${RW}" fill="${ROAD}"/>`;
  const A=M.stations[0],B=M.stations[1];
  s+=`<rect x="${A.cx-18}" y="${RAILY}" width="36" height="${GY[0]-RAILY}" fill="${ROAD}"/>`;
  s+=`<rect x="${GX[4]}" y="${B.cy-18}" width="${RAILX-GX[4]}" height="36" fill="${ROAD}"/>`;
  /* 鉄道 */
  const rd=`M0,${RAILY}H${RAILX}V${MH-24}`;
  s+=`<path d="${rd}" fill="none" stroke="#222" stroke-width="13"/><path d="${rd}" fill="none" stroke="#fff" stroke-width="7.5" stroke-dasharray="22 22"/>`;
  /* バスの道 */
  const lp=M.pts.map(XY);
  s+=`<g class="bus"><path d="M${lp.map(p=>p.join(',')).join('L')}Z" fill="none" stroke="#333" stroke-width="6" stroke-dasharray="0.1 12" stroke-linecap="round"/>`;
  for(let k=0;k<lp.length;k++){
    const p=lp[k],q=lp[(k+1)%lp.length];const d=[Math.sign(q[0]-p[0]),Math.sign(q[1]-p[1])];
    s+=arrowHead((p[0]+q[0])/2+d[0]*10,(p[1]+q[1])/2+d[1]*10,d[0],d[1],11,'#333');
  }
  s+='</g>';
  /* バス停 */
  for(const st of M.stops)s+=busIcon(st.ix,st.iy);
  /* 施設の記号 */
  for(const f of M.facs){if(f.type!=='park')s+=sym(TYPES[f.type].sym,f.sx,f.sy);}
  /* 方位記号 */
  s+=`<g transform="translate(31,36)"><text x="0" y="-18" font-size="17" font-weight="700" text-anchor="middle" fill="#222" font-family="sans-serif">N</text>
    <path d="M0,-14V26" stroke="#222" stroke-width="2.6"/><path d="M0,-14L-9,8L0,3Z" fill="#222"/></g>`;
  /* 縮尺 */
  const sy=MH-26;
  s+=`<g stroke="#222" stroke-width="2"><path d="M${GX[0]},${sy}H${GX[0]+300}"/>`;
  for(let i=0;i<=5;i++)s+=`<path d="M${GX[0]+i*60},${sy}V${sy-(i%5===0?12:7)}"/>`;

function findDirPair(M,exclude){

    if(f===g)continue;const dx=g.sx-f.sx,dy=g.sy-f.sy;if(Math.hypot(dx,dy)<190)continue;

    let diff=Math.abs(deg-k*45);if(diff>180)diff=360-diff;if(diff>11)continue;
    if(exclude&&exclude(f,g,k))continue;

  }

function shapesFrom(e,g){
  const dx=g[0]-e[0],dy=g[1]-e[1],sx=Math.sign(dx),sy=Math.sign(dy),ax=Math.abs(dx),ay=Math.abs(dy);
  const mv=[];

    mv.push([['h',dx],['v',dy]],[['v',dy],['h',dx]]);
    for(let k=1;k<ax;k++)mv.push([['h',sx*k],['v',dy],['h',dx-sx*k]]);
    for(let k=1;k<ay;k++)mv.push([['v',sy*k],['h',dx],['v',dy-sy*k]]);

  return mv.map(ms=>{const nodes=[e.slice()];let c=e.slice();
    for(const [ax2,n] of ms){const st=Math.sign(n);for(let i=0;i<Math.abs(n);i++){c=ax2==='h'?[c[0]+st,c[1]]:[c[0],c[1]+st];nodes.push(c.slice());}}

}
function genRoute(M){
  const corner={};M.facs.forEach(f=>{const c=cornerOf(f);if(c){(corner[c.join()]=corner[c.join()]||[]).push(f);}});
  const NP=M.pts.length;
  for(let t=0;t<120;t++){
    const S=pick(M.stops);const a=M.pts[S.seg],b=M.pts[(S.seg+1)%NP];
    const goals=M.facs.filter(f=>cornerOf(f));const G=pick(goals);const g=cornerOf(G);
    const cands=[];
    for(const e of [a,b]){
      const d0=[Math.sign(GX[e[0]]-S.rx),Math.sign(GY[e[1]]-S.ry)];
      if(Math.abs(g[0]-e[0])+Math.abs(g[1]-e[1])<2)continue;
      for(const nodes of shapesFrom(e,g)){
        if(nodes.length>1){const f1=[Math.sign(nodes[1][0]-e[0]),Math.sign(nodes[1][1]-e[1])];if(f1[0]===-d0[0]&&f1[1]===-d0[1])continue;}
        /* 曲がり角 */
        const pts=[[S.rx,S.ry],...nodes.map(XY)];const turns=[];let prev=d0;
        for(let i=1;i<nodes.length;i++){const d=[Math.sign(nodes[i][0]-nodes[i-1][0]),Math.sign(nodes[i][1]-nodes[i-1][1])];
          if(d[0]!==prev[0]||d[1]!==prev[1])turns.push({at:nodes[i-1],d});prev=d;}
        if(turns.length<1||turns.length>3)continue;
        cands.push({nodes,pts,turns,d0,key:nodes.map(n=>n.join()).join('|')});
      }
    }
    const good=cands.filter(c=>c.turns.every(tn=>(corner[tn.at.join()]||[]).some(f=>f!==G)));
    if(!good.length||cands.length<3)continue;
    const ans=pick(good);
    const rest=cands.filter(c=>c.key!==ans.key);
    const same=rest.filter(c=>c.d0[0]===ans.d0[0]&&c.d0[1]===ans.d0[1]&&c.nodes[0].join()===ans.nodes[0].join());
    let ds=[];if(same.length)ds.push(pick(same));
    for(const c of shuffle(rest)){if(ds.length>=2)break;if(!ds.includes(c))ds.push(c);}
    if(ds.length<2)continue;
    const routes=shuffle([ans,...ds]);
    /* 説明文 */
    const marks=[];
    let txt=`${stopN(S)}から、${d4name(ans.d0[0],ans.d0[1])}に{向|む}かって{歩|ある}きます。`;
    for(const tn of ans.turns){const L=pick(corner[tn.at.join()].filter(f=>f!==G));marks.push(L);
      txt+=`${facN(L)}のかどを、${d4name(tn.d[0],tn.d[1])}に{曲|ま}がります。`;}
    txt+=`そのまままっすぐ{歩|ある}くと、${facN(G)}に{着|つ}きます。`;
    const ST=[{dash:'16 10',cap:'butt',w:5},{dash:'0.1 11',cap:'round',w:7},{dash:'26 7 3 7',cap:'butt',w:4}];
    const KANA=['ア','イ','ウ'];const OFF=[-9,0,9];
    const tags=[];routes.forEach((r,i)=>{const pp=r.pts.map(p=>[p[0]+OFF[i],p[1]+OFF[i]]);
      let best=null,bd=-1;for(let j=1;j<pp.length;j++){for(const t of [0.35,0.5,0.65]){const x=pp[j-1][0]+(pp[j][0]-pp[j-1][0])*t,y=pp[j-1][1]+(pp[j][1]-pp[j-1][1])*t;
        if(dist(x,y,...pp[j-1])<40&&dist(x,y,...pp[j])<40)continue;
        let md=1e9;for(const tg of tags)md=Math.min(md,dist(x,y,tg[0],tg[1]));for(const [ox,oy] of [[S.ix,S.iy],[G.sx,G.sy]])md=Math.min(md,dist(x,y,ox,oy));
        if(md>bd){bd=md;best=[x,y];}}}
      tags.push(best||pp[1]);});
    const pre=()=>{let s='',h='';routes.forEach((r,i)=>{const pp=r.pts.map(p=>[p[0]+OFF[i],p[1]+OFF[i]]);s+=pathArrow(pp,'#1a1a1a',ST[i].w,ST[i].dash,ST[i].cap);});
      routes.forEach((r,i)=>{s+=`<circle cx="${tags[i][0]}" cy="${tags[i][1]}" r="15" fill="#fff" stroke="#1a1a1a" stroke-width="2.5"/><text x="${tags[i][0]}" y="${tags[i][1]+7}" font-size="19" font-weight="700" text-anchor="middle" fill="#1a1a1a" font-family="BIZ UDPGothic,sans-serif">${KANA[i]}</text>`;});
      s+=ring(S.ix,S.iy,24,'#1a1a1a',3)+ring(G.sx,G.sy,22,'#1a1a1a',3);return{svg:s,dimBus:true};};
    const styleSample=i=>`<svg width="80" height="22" viewBox="0 0 80 22" aria-hidden="true">${pathArrow([[4,11],[76,11]],'#1a1a1a',ST[i].w,ST[i].dash,ST[i].cap)}</svg>`;
    return mkChoiceQ({kind:'route',text:`つぎの{文|ぶん}に{合|あ}う{道順|みちじゅん}は、ア・イ・ウのどれ？<span class="opt" style="margin-top:6px;padding:6px 10px;border:2px solid #333;border-radius:8px;text-indent:0;line-height:2">${txt}</span>`,
      choices:routes.map((r,i)=>({html:`<span class="mk">${KANA[i]}</span>${styleSample(i)}`})),ans:routes.indexOf(ans),one:false,hl:[S.id,G.id],pre,
      exp:()=>{const i=routes.indexOf(ans);const pp=ans.pts.map(p=>[p[0]+OFF[i],p[1]+OFF[i]]);let s=pathArrow(pp,HL,9);
        let h='';ans.turns.forEach((tn,j)=>{const [x,y]=XY(tn.at);s+=ring(x,y,20,HL2,4);});
        marks.forEach(L=>s+=ring(L.sx,L.sy,22,HL2,4));
        return{svg:s,html:h,hl:[S.id,G.id,...marks.map(m=>m.id)],why:`{文|ぶん}のとおりに{指|ゆび}でたどってみてね。{最初|さいしょ}は${d4name(ans.d0[0],ans.d0[1])}へ。${marks.map((L,j)=>`${facN(L)}のかどで${d4name(ans.turns[j].d[0],ans.turns[j].d[1])}へ`).join('、')}{曲|ま}がると、${facN(G)}に{着|つ}くね。だから<b>${KANA[i]}</b>だよ。`};}});
  }
  return null;
}

/* 進行方向の左右 */
function sideList(M,p,q){
  const NP=M.pts.length;let u1=M.stops[p].u,u2=M.stops[q].u;if(u2<=u1)u2+=NP;
  const L=[],Rt=[],seen=new Set();
  for(let m=Math.floor(u1);m<u2;m++){
    const ov=Math.min(u2,m+1)-Math.max(u1,m);if(ov<0.45)continue;
    const a=M.pts[m%NP],b=M.pts[(m+1)%NP];const A=XY(a),B=XY(b);const d=[Math.sign(B[0]-A[0]),Math.sign(B[1]-A[1])];
    const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2;
    for(const [c,r] of segBlocks(a,b)){
      const f=M.byBlock[c+','+r];if(!f||seen.has(f.id))continue;seen.add(f.id);
      const cx=(GX[c]+GX[c+1])/2,cy=(GY[r]+GY[r+1])/2;const z=d[0]*(cy-my)-d[1]*(cx-mx);
      (z>0?Rt:L).push({f,mx,my,d});
    }
  }
  return{L,Rt,seen};
}
function genLeftRight(M){
  const n=M.stops.length;
  for(let t=0;t<80;t++){
    const p=rnd(n),k=2+rnd(3);if(k>=n-1)continue;const q=(p+k)%n;
    const {L,Rt,seen}=sideList(M,p,q);if(!L.length||!Rt.length)continue;
    const left=Math.random()<.5;const pool=left?L:Rt,other=left?Rt:L;
    const ans=pick(pool);
    const wrong=sample(other,2).map(o=>o.f);
    const far=shuffle(M.facs.filter(f=>!seen.has(f.id)));
    while(wrong.length<3&&far.length)wrong.push(far.pop());
    const ch=shuffle([ans.f,...wrong]);
    const P=M.stops[p],Qs=M.stops[q];
    const side=left?'{左|ひだり}':'{右|みぎ}';
    return mkChoiceQ({kind:'lr',text:`${stopN(P)}から${stopN(Qs)}までバスで{行|い}くとき、{進行方向|しんこうほうこう}に{向|む}かって${side}{側|がわ}に{見|み}えるのは、どれ？`,
      choices:ch.map(x=>({html:R(x.name)})),ans:ch.indexOf(ans.f),hl:[P.id,Qs.id],
      exp:()=>{
        let s=pathArrow(busSub(M,p,q),HL,8);
        const {mx,my,d}=ans;const lv=[d[1],-d[0]],rv=[-d[1],d[0]];
        s+=`<circle cx="${mx}" cy="${my}" r="30" fill="#fff" stroke="${HL2}" stroke-width="4"/>`+lineArrow(mx-d[0]*20,my-d[1]*20,mx+d[0]*24,my+d[1]*24,HL2,6);
        s+=ring(ans.f.sx,ans.f.sy,24);
        const h=otag(mx+lv[0]*62,my+lv[1]*62,'{左|ひだり}','big')+otag(mx+rv[0]*62,my+rv[1]*62,'{右|みぎ}','big');
        return{svg:s,html:h,hl:[P.id,Qs.id,ans.f.id],orient:d,
          why:`バスは{矢印|やじるし}の{向|む}きに{進|すす}むよ。{進|すす}む{向|む}きに{体|からだ}を{向|む}けると、${facN(ans.f)}は<b>${side}{側|がわ}</b>に{見|み}えるよ。{地図|ちず}の{上|うえ}・{下|した}ではなく、バスの{向|む}きで{考|かんが}えるといいよ。`};}});
  }
  return null;
}

/* 正しい文 */
function genTrue(M){
  const n=M.stops.length;
  const makers={
    rail(ok){const st=pick(M.stations);const real=st.id==='A'?'{東西|とうざい}':'{南北|なんぼく}',fake=st.id==='A'?'{南北|なんぼく}':'{東西|とうざい}';
      return{t:`${Q(st.name)}を{通|とお}る{鉄道|てつどう}は、${ok?real:fake}の{方向|ほうこう}に{走|はし}っている。`,why:`${Q(st.name)}を{通|とお}る{鉄道|てつどう}は${real}に{走|はし}っている。`,hl:[st.id]};},
    dir(ok){const pr=findDirPair(M);if(!pr)return null;const {f,g,k}=pr;const c=ok?k:(k+4)%8;
      return{t:`${facN(f)}から{見|み}て、${facN(g)}は${DIR8[c]}にある。`,why:`${facN(g)}は${facN(f)}の${DIR8[k]}にある。`,hl:[f.id,g.id]};},
    count(ok){const ks=allSymTypes(M);const k=pick(ks);const c=facsOfSym(M,k).length;const v=ok?c:(c===1?2:c+pick([-1,1]));
      return{t:`この{地図|ちず}には、${Q(SYMS[k])}の{記号|きごう}が${v}つある。`,why:`${Q(SYMS[k])}の{記号|きごう}は${c}つ。`,hl:facsOfSym(M,k).map(f=>f.id)};},
    ahead(ok){const p=rnd(n),k=2+rnd(3);const q=(p+k)%n;const v=ok?k:(n-k!==k?n-k:k+1);
      return{t:`${stopN(M.stops[q])}は、${stopN(M.stops[p])}の${v}つ{先|さき}のバス{停|てい}である。`,why:`${stopN(M.stops[q])}は${k}つ{先|さき}。`,hl:[M.stops[p].id,M.stops[q].id]};},
    side(ok){for(let t=0;t<30;t++){const p=rnd(n),k=2+rnd(2);const q=(p+k)%n;const sl=sideList(M,p,q);const all=[...sl.L.map(o=>[o,1]),...sl.Rt.map(o=>[o,0])];if(!all.length)continue;
        const [o,isL]=pick(all);const real=isL?'{左|ひだり}':'{右|みぎ}',fake=isL?'{右|みぎ}':'{左|ひだり}';
        return{t:`${stopN(M.stops[p])}から${stopN(M.stops[q])}までバスで{行|い}くとき、${facN(o.f)}は{進行方向|しんこうほうこう}に{向|む}かって${ok?real:fake}{側|がわ}に{見|み}える。`,why:`${facN(o.f)}は${real}{側|がわ}に{見|み}える。`,hl:[M.stops[p].id,M.stops[q].id,o.f.id]};}
      return null;}
  };
  for(let t=0;t<30;t++){
    const kinds=sample(Object.keys(makers),3);const ti=rnd(3);
    const st=kinds.map((k,i)=>makers[k](i===ti));if(st.some(x=>!x))continue;
    return mkChoiceQ({kind:'true',text:'この{地図|ちず}から{読|よ}みとれることとして、{正|ただ}しいものはどれ？',one:true,
      choices:st.map(x=>({html:R(x.t)})),ans:ti,
      exp:()=>({hl:st[ti].hl,why:st.map((x,i)=>`${i===ti?'<b>○</b>':'×'} ${x.why}`).join('<br>')})});
  }
  return null;
}

/* 乗りかえと時間 */
function genTransfer(M){
  const n=M.stops.length;const A=M.stations[0],B=M.stations[1];
  const fAB=fwd(M,M.iA,M.iB),fBA=fwd(M,M.iB,M.iA);
  const [S1,S2]=fAB<=fBA?[A,B]:[B,A];const i1=S1.stop.idx,i2=S2.stop.idx;
  const back=1+rnd(2);const p=(i1-back+n)%n;if(p===i2)return null;
  const sum=(i,j)=>{let s=0;for(let x=i;x!==j;x=(x+1)%n)s+=M.segMin[x];return s;};
  let ok=false;
  for(let t=0;t<60;t++){
    for(let x=i1;x!==i2;x=(x+1)%n)M.segMin[x]=2+rnd(4);
    M.trainMin=2+rnd(6);M.wait=2+rnd(4);
    const d=sum(i1,i2)-(M.trainMin+M.wait);if(Math.abs(d)>=2){ok=true;break;}
  }
  if(!ok)return null;
  const P=M.stops[p];
  const a1=sum(p,i1),bus2=sum(i1,i2),busT=a1+bus2,trT=a1+M.wait+M.trainMin;
  const busFast=busT<trT;
  const lst=(i,j)=>{const a=[];for(let x=i;x!==j;x=(x+1)%n)a.push(M.segMin[x]);return a.join('＋');};
  const pre=()=>({svg:timesOverlay(M)});
  const S2stop=S2.stop;
  const head=`〇の{中|なか}の{数字|すうじ}は、{次|つぎ}のバス{停|てい}（{駅|えき}）までにかかる{時間|じかん}（{分|ふん}）だよ。<br>`;
  const ways=`<span class="opt">ア：バスに{乗|の}ったまま、${stopN(S2stop)}まで{行|い}く。</span><span class="opt">イ：${stopN(S1.stop)}でおりて、${Q(S1.name)}から{電車|でんしゃ}に{乗|の}りかえる。{電車|でんしゃ}が{来|く}るまで${FUN(M.wait)}{待|ま}つ。</span>`;
  const exp=()=>{
    const bp=busSub(M,p,i2), tp=busSub(M,p,i1), rp=railPath(M);
    const rail2=S1.id==='A'?rp:rp.slice().reverse();
    let s=pathArrow(bp,HL,8)+polyl(tp.map(q=>[q[0]+10,q[1]+10]),HL2,6,'14 8')+pathArrow(rail2.map(q=>[q[0]+(S1.id==='A'?0:-16),q[1]+(S1.id==='A'?16:0)]),HL2,6,'14 8');
    return{svg:s,hl:[P.id,S1.id,S2.id,S1.stop.id,S2stop.id],
      why:`ア（オレンジ）：${lst(p,i2)}＝<b>${FUN(busT)}</b><br>イ（{青|あお}）：${lst(p,i1)}＋{待|ま}つ${FUN(M.wait)}＋{電車|でんしゃ}${FUN(M.trainMin)}＝<b>${FUN(trT)}</b><br>だから、<b>${busFast?'ア':'イ'}</b>のほうが${FUN(Math.abs(busT-trT))}{早|はや}く{着|つ}くよ。{待|ま}ち{時間|じかん}をたすのをわすれないでね。`};
  };
  const q1=mkChoiceQ({kind:'tr1',text:`${head}${stopN(P)}から${Q(S2.name)}まで{行|い}くよ。${ways}{早|はや}く{着|つ}くのは、どちら？`,
    one:true,choices:[{html:R('ア　バスに{乗|の}ったまま')},{html:R('イ　{電車|でんしゃ}に{乗|の}りかえる')}],ans:busFast?0:1,hl:[P.id,S2.id],pre,exp});
  const q2={kind:'tr2',input:'num',num:{min:0,max:60,step:1,dec:0,unit:'{分|ふん}'},ans:Math.min(busT,trT),hl:[P.id,S2.id],pre,
    text:`${head}${stopN(P)}から${Q(S2.name)}まで{行|い}くよ。${ways}{早|はや}く{着|つ}くほうで{行|い}くと、{何分|なんぷん}かかる？`,exp};
  return[q1,q2];
}

  1:{desc:'記号・近い駅やバス停・m→km',sd:'{記号|きごう}・{近|ちか}い{駅|えき}・kmになおす',slots:[['symbolMeaning','symbolPick'],['nearestStation','nearestStop'],['nearestStop','count'],['km']],shuffleFirst:true},
  2:{desc:'道をはさんだ方位・鉄道の向き・数える・8方位',sd:'{方位|ほうい}・{数|かぞ}える',slots:[['neighbor'],['railDir'],['count'],['dir8','neighbor']]},
  3:{desc:'方位・いくつ先のバス停・数える・道順',sd:'いくつ{先|さき}・{道順|みちじゅん}',slots:[['dir8','neighbor'],['ahead'],['count','dir8'],['route','ahead']]},
  4:{desc:'進行方向の左右・正しい文・乗りかえの時間くらべ',sd:'{左右|さゆう}・{乗|の}りかえ',slots:[['leftRight','dir8'],['trueStmt','ahead'],['transfer']]}
};
const KINDNAME={symbol:'{地図記号|ちずきごう}',nstation:'{近|ちか}い{駅|えき}',nstop:'{近|ちか}いバス{停|てい}',km:'kmになおす',neighbor:'{方位|ほうい}（{道|みち}をはさんで）',
  rail:'{鉄道|てつどう}の{方向|ほうこう}',count:'{数|かぞ}える',dir8:'8{方位|ほうい}',ahead:'いくつ{先|さき}',route:'{道順|みちじゅん}',lr:'{進行方向|しんこうほうこう}の{左右|さゆう}',
  true:'{正|ただ}しい{文|ぶん}',tr1:'{早|はや}く{着|つ}くのは',tr2:'かかる{時間|じかん}'};
function makeSet(M,L){
  const lv=LEVELS[L];const out=[];
  let slots=lv.slots.map(s=>s.slice());
  if(L===1&&Math.random()<.5)slots[0].reverse();
  for(const sl of slots){
    let got=null;
    for(const g of sl){const r=GEN[g](M);if(r){got=r;break;}}
    if(!got){/* 予備 */for(const g of ['neighbor','nearestStop','count']){const r=GEN[g](M);if(r){got=r;break;}}}
    if(Array.isArray(got))out.push(...got);else if(got)out.push(got);
  }
  out.forEach(q=>q.M=M);
  return out;
}
function buildQuiz(){
  const qs=[];let no=0;
  while(qs.length<settings.count){
    let set=null;
    for(let t=0;t<20&&(!set||set.length<3);t++){const M=genMap();set=makeSet(M,settings.level);}
    no++;set.forEach(q=>q.mapNo=no);qs.push(...set);
  }
  qs.length=settings.count;return qs;
}

  if(QZ.curMap!==q.M)renderMap(q.M);
  $('#prog').innerHTML=R(`{問題|もんだい} ${QZ.i+1} / ${QZ.qs.length}`);
  $('#mapno').innerHTML=R(`{地図|ちず} ${q.mapNo}`);
  $('#qkind').innerHTML=R(KINDNAME[q.kind]||'');
  $('#qtext').innerHTML=R(q.text);
  $('#qextra').innerHTML=q.extra||'';$('#qextra').hidden=!q.extra;
  const ans=$('#answers');ans.innerHTML='';
  const longest=q.input==='choice'?Math.max(...q.choices.map(c=>c.html.replace(/<rt>.*?<\/rt>/g,'').replace(/<[^>]+>/g,'').length)):0;
  ans.className='answers'+(q.one||longest>7?' one':'');
  q.sel=null;
  if(q.input==='choice'){
    q.choices.forEach((c,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=c.html;
      b.addEventListener('click',()=>{if(q.done)return;q.sel=i;ans.querySelectorAll('.choice').forEach((x,j)=>x.classList.toggle('sel',j===i));$('#btnAnswer').disabled=false;});
      ans.appendChild(b);});
    $('#btnAnswer').disabled=true;
  }else{
    numVal=0;
    ans.className='answers one';
    ans.innerHTML=`<div class="numrow"><button class="step" id="nDown" aria-label="へらす">▽</button><input id="nInput" inputmode="${q.num.dec?'decimal':'numeric'}" value="0" aria-label="こたえ"><button class="step" id="nUp" aria-label="ふやす">△</button><span class="unit">${R(q.num.unit)}</span></div>`;
    const inp=$('#nInput');const fmt=v=>q.num.dec?String(Math.round(v*10)/10):String(Math.round(v));
    const setv=v=>{v=Math.max(q.num.min,Math.min(q.num.max,v));numVal=q.num.dec?Math.round(v*10)/10:Math.round(v);inp.value=fmt(numVal);};
    $('#nUp').addEventListener('click',()=>{if(!q.done)setv(numVal+q.num.step);});
    $('#nDown').addEventListener('click',()=>{if(!q.done)setv(numVal-q.num.step);});
    inp.addEventListener('input',()=>{const t=inp.value.replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[^0-9.]/g,'');const v=parseFloat(t);if(!isNaN(v))numVal=v;});
    inp.addEventListener('change',()=>setv(numVal));
    $('#btnAnswer').disabled=false;
  }
  q.done=false;
  $('#btnAnswer').parentElement.hidden=false;
  $('#feedback').hidden=true;
  setOverlay([{hl:q.hl||[]},q.pre?q.pre():null]);
  $('#qside').scrollTop=0;
  if(innerWidth<innerHeight)$('#qmain').scrollTop=0;
}
function answer(){
  const q=QZ.qs[QZ.i];if(q.done)return;
  unlockAudio();
  let ok,ansText;
  if(q.input==='choice'){
    if(q.sel==null)return;ok=q.sel===q.ans;ansText=q.choices[q.ans].html;
    $('#answers').querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;
      if(j===q.ans){b.classList.add('right');b.insertAdjacentHTML('afterbegin','<span class="mk">○</span>');}
      else if(j===q.sel){b.classList.add('wrong');b.insertAdjacentHTML('afterbegin','<span class="mk">×</span>');}});
  }else{
    const inp=$('#nInput');const t=inp.value.replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));const v=parseFloat(t);
    if(!isNaN(v))numVal=v;ok=Math.abs(numVal-q.ans)<1e-6;ansText=q.ans+R(q.num.unit);
    inp.disabled=true;$('#nUp').disabled=true;$('#nDown').disabled=true;
  }
  q.done=true;q.ok=ok;QZ.res.push({kind:q.kind,ok});
  ok?sndOK():sndNG();
  const fb=$('#feedback');fb.hidden=false;fb.className='feedback '+(ok?'ok':'ng');
  const at=String(ansText).replace(/<svg[\s\S]*?<\/svg>/g,'').replace(/<span class="mk">(.*?)<\/span>/,'$1').trim();
  $('#verdict').innerHTML=ok?'○ せいかい！':R(at?`× おしい！ {正|ただ}しい{答|こた}えは「${at}」だよ`:'× おしい！ ○がついているのが{正|ただ}しい{答|こた}えだよ');
  const e=q.exp?q.exp():{};
  $('#explain').innerHTML=R(e.why||'');
  $('#orient').innerHTML=e.orient?orientSVG(e.orient):'';
  setOverlay([q.pre?q.pre():null,e,{hl:q.hl||[]}]);
  $('#btnAnswer').parentElement.hidden=true;
  $('#btnNext').innerHTML=QZ.i+1<QZ.qs.length?'つぎへ':'けっかを{見|み}る'.replace(/\{([^|{}]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
  if(innerWidth<innerHeight){/* 縦向きは地図が見えるように */ }
  setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),60);
}
function orientSVG(d){
  const ang=Math.atan2(d[1],d[0])*180/Math.PI+90;/* 上向き基準の回転 */
  const lv=[d[1],-d[0]],rv=[-d[1],d[0]];
  const cx=90,cy=80;
  return `<svg width="200" height="160" viewBox="0 0 180 160" aria-hidden="true">
    <rect x="1" y="1" width="178" height="158" rx="12" fill="#F6F8F7" stroke="#C9D3CE"/>
    <g transform="translate(${cx},${cy}) rotate(${ang})"><path d="M0,34V-22" stroke="${HL2}" stroke-width="8" stroke-linecap="round"/><path d="M0,-40L-16,-16H16Z" fill="${HL2}"/>
    <circle cx="0" cy="12" r="11" fill="#fff" stroke="#222" stroke-width="3"/></g>
    <text x="${cx+lv[0]*58}" y="${cy+lv[1]*58+9}" font-size="26" font-weight="700" text-anchor="middle" fill="#9A4A00" font-family="BIZ UDPGothic,sans-serif">左</text>
    <text x="${cx+rv[0]*58}" y="${cy+rv[1]*58+9}" font-size="26" font-weight="700" text-anchor="middle" fill="#9A4A00" font-family="BIZ UDPGothic,sans-serif">右</text>
  </svg>`;
}
function nextQ(){
  if(QZ.i+1<QZ.qs.length){QZ.i++;showQ();}else showResult();
}
function showResult(){
  const n=QZ.res.length,k=QZ.res.filter(r=>r.ok).length;
  $('#resTitle').innerHTML=R('{結果|けっか}');
  $('#score').innerHTML=R(`${n}{問|もん}{中|ちゅう} ${k}{問|もん} せいかい`);
  $('#reslist').innerHTML=QZ.res.map((r,i)=>`<div class="resrow ${r.ok?'ok':'ng'}"><span>${i+1}</span><span class="m">${r.ok?'○ せいかい':'× もういちど'}</span><span>${R(KINDNAME[r.kind]||'')}</span></div>`).join('');
  show('result');
}

/* 拡大 */
let zs=1;
function openZoom(){
  if(!QZ||!QZ.curMap)return;
  const src=$('#mapcanvas');const z=$('#zframe');
  z.innerHTML='';const c=src.cloneNode(true);c.removeAttribute('id');c.style.transform='';z.appendChild(c);
  $('#zoom').hidden=false;
  const sc=$('#zscroll');zs=Math.max(0.5,Math.min(1.4,(sc.clientWidth-20)/MW*1.3));
  applyZoom();
}
function applyZoom(){
  const z=$('#zframe'),c=z.firstChild;if(!c)return;
  c.style.transform=`scale(${zs})`;z.style.width=MW*zs+'px';z.style.height=MH*zs+'px';
}

/* 設定 */
function openSettings(){
  const seg=$('#segLevel');seg.innerHTML='';
  [1,2,3,4].forEach(L=>{const b=document.createElement('button');b.textContent=String(L);b.className=settings.level===L?'on':'';
    b.addEventListener('click',()=>{settings.level=L;saveSet();openSettings();});seg.appendChild(b);});
  $('#lvdesc').textContent='レベル'+settings.level+'：'+LEVELS[settings.level].desc;
  $('#cntInput').value=settings.count;
  $('#segSound').querySelectorAll('button').forEach(b=>b.className=(settings.sound?'1':'0')===b.dataset.v?'on':'');
  $('#mSettings').hidden=false;
}
function saveSet(){store.set(KEY_SET,settings);}
function setCount(v){settings.count=Math.max(4,Math.min(20,Math.round(v)||8));$('#cntInput').value=settings.count;saveSet();}

/* 使い方 */
function openHelp(){
  $('#helpTtl').innerHTML=R('{使|つか}い{方|かた}');
  $('#helpList').innerHTML=[
    '{地図|ちず}を{見|み}て、{右|みぎ}（または{下|した}）の{問題|もんだい}に{答|こた}えるよ。',
    '{答|こた}えをえらんで、「こたえる」をおしてね。{数字|すうじ}の{問題|もんだい}は、△▽で{数|かず}をかえられるよ。',
    '{答|こた}えたあとは、{地図|ちず}の{上|うえ}にオレンジ{色|いろ}で、{見|み}るところが{出|で}るよ。',
    '{地図|ちず}が{小|ちい}さいときは「{大|おお}きく{見|み}る」をおしてね。',
    '{地図|ちず}は{上|うえ}が{北|きた}だよ。'
  ].map(t=>`<li>${R(t)}</li>`).join('');
  $('#noHelpTxt').innerHTML=R('{次回|じかい}から{表示|ひょうじ}しない');
  $('#chkNoHelp').checked=!!store.get(KEY_HELP,false);
  $('#mHelp').hidden=false;
}

/* イベント */
$('#btnStart').addEventListener('click',startQuiz);
$('#btnHelp').addEventListener('click',openHelp);
$('#btnHelpClose').addEventListener('click',()=>{store.set(KEY_HELP,$('#chkNoHelp').checked);$('#mHelp').hidden=true;});
$('#btnSettings').addEventListener('click',openSettings);
$('#btnSetClose').addEventListener('click',()=>{setCount(parseInt($('#cntInput').value,10));$('#mSettings').hidden=true;startView();});
$('#cntUp').addEventListener('click',()=>setCount(settings.count+1));
$('#cntDown').addEventListener('click',()=>setCount(settings.count-1));
$('#cntInput').addEventListener('change',()=>setCount(parseInt($('#cntInput').value,10)));
$('#segSound').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{settings.sound=b.dataset.v==='1';saveSet();openSettings();}));
$('#btnAnswer').addEventListener('click',answer);
$('#btnNext').addEventListener('click',nextQ);
$('#btnQuit').addEventListener('click',()=>{$('#mQuit').hidden=false;});
$('#btnQuitNo').addEventListener('click',()=>{$('#mQuit').hidden=true;});
$('#btnQuitYes').addEventListener('click',()=>{$('#mQuit').hidden=true;QZ=null;startView();});
$('#btnZoom').innerHTML=R('{大|おお}きく{見|み}る');
$('#btnZoom').addEventListener('click',openZoom);
$('#zClose').addEventListener('click',()=>{$('#zoom').hidden=true;$('#zframe').innerHTML='';});
$('#zIn').addEventListener('click',()=>{zs=Math.min(2.2,zs*1.25);applyZoom();});
$('#zOut').addEventListener('click',()=>{zs=Math.max(0.35,zs/1.25);applyZoom();});
$('#btnAgain').addEventListener('click',startQuiz);
$('#btnHome').addEventListener('click',()=>{QZ=null;startView();});
addEventListener('resize',fitMap);
addEventListener('orientationchange',()=>setTimeout(fitMap,250));
if(window.ResizeObserver)new ResizeObserver(()=>fitMap()).observe($('#mapbox'));
document.addEventListener('gesturestart',e=>{if($('#zoom').hidden)e.preventDefault();});

startView();
if(!store.get(KEY_HELP,false))openHelp();
</script>
</body>
</html>
