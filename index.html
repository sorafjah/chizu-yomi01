<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地図を読もう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
/* 地図帳のような落ち着いた紙色＋道路グレー。強調はだいだい色1色。 */
:root{
  --bg:#EDF1EE; --panel:#FFFFFF; --ink:#22302B; --sub:#56665F; --line:#C7D1CC;
  --accent:#1E6A84; --accent-weak:#DDEBF0; --ok:#2C7A4B; --ok-weak:#E2F2E8;
  --ng:#A9532F; --ng-weak:#F8E8DF; --hl:#E07A1F; --hl-weak:#FFF0E0;
  --font:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  touch-action:manipulation;overflow:hidden;-webkit-tap-highlight-color:transparent}
rt{font-size:.5em;font-weight:400}
button{font-family:var(--font);color:var(--ink);touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

/* ボタン */
.btn{min-height:56px;min-width:56px;padding:8px 26px;border-radius:14px;border:2px solid var(--accent);
  background:var(--panel);color:var(--accent);font-size:22px;font-weight:700;line-height:1.9}
.btn.primary{background:var(--accent);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.iconbtn{min-width:52px;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--panel);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:17px;font-weight:700;padding:0 12px}

/* スタート */
#start{align-items:center;justify-content:center;overflow:auto}
.topright{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);display:flex;gap:10px}
.startcard{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px;text-align:center;max-width:640px}
.startcard h1{margin:0;font-size:clamp(38px,7vw,58px);letter-spacing:.06em;line-height:1.6}
.startcard .lead{font-size:21px;line-height:2;margin:0;color:var(--sub)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 16px;font-size:18px;font-weight:700}
.startillust{width:min(420px,86vw);height:auto}

/* 問題画面 */
#quiz header{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:2px solid var(--line);flex:none}
#quiz header .prog{flex:1;text-align:center;font-size:20px;font-weight:700}
.qmain{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:12px;padding:10px 14px}
.mapcol{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
#mapbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#mapsizer{position:relative;overflow:hidden;border:2px solid #9AA59F;border-radius:6px;background:#FAF9F4}
#mapscale{position:absolute;left:0;top:0;width:1000px;height:760px;transform-origin:0 0}
#mapscale svg{position:absolute;left:0;top:0}
#labels{position:absolute;left:0;top:0;width:1000px;height:760px}
#hl{pointer-events:none}
.flab{position:absolute;transform:translateX(-50%);white-space:nowrap;font-size:20px;font-weight:700;line-height:1.75;padding:0 4px;border-radius:6px;color:#1f1f1f}
.flab rt{font-size:10px}
.station{position:absolute;transform:translate(-50%,-50%);background:#fff;border:3px solid #222;border-radius:4px;padding:0 12px;font-size:22px;font-weight:700;line-height:1.7;white-space:nowrap}
.station rt{font-size:11px}
.stop{position:absolute;transform:translate(-50%,-50%);background:#fff;border:2.5px solid #222;border-radius:8px;font-size:17px;font-weight:700;white-space:nowrap;line-height:1.65;padding:0 7px;display:flex;align-items:center;gap:4px}
.stop rt{font-size:9px}
.stop.v{writing-mode:vertical-rl;text-orientation:upright;padding:5px 0;line-height:1.5;font-size:16px}
.stop .bi{width:16px;height:16px;flex:none}
.northlab{position:absolute;font-size:18px;font-weight:700;line-height:1.7}
.hlon{outline:4px solid var(--hl);background:var(--hl-weak)}
.legend{flex:none;display:flex;flex-wrap:wrap;gap:4px 14px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:4px 10px;font-size:14px;line-height:1.9;align-items:center}
.legend .it{display:inline-flex;align-items:center;gap:4px}
.legend svg{flex:none}
.legend b{font-size:14px}

.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 16px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.lvchip{align-self:flex-start;font-size:15px;font-weight:700;color:var(--accent);background:var(--accent-weak);border-radius:999px;padding:2px 12px;line-height:1.9}
.qtext{font-size:21px;line-height:2.15;margin:0}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:58px;padding:6px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;font-size:20px;line-height:2}
.opt .mk{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;background:var(--bg);line-height:1}
.opt.sel{border-color:var(--accent);background:var(--accent-weak)}
.opt.sel .mk{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-weak)}
.opt.wrong{border-color:var(--ng);background:var(--ng-weak)}
.opt .res{margin-left:auto;font-size:16px;font-weight:700;white-space:nowrap}
.numrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.numrow input{width:130px;height:60px;font-size:30px;font-weight:700;text-align:center;border:2px solid var(--accent);border-radius:12px;font-family:var(--font);-webkit-user-select:text;user-select:text;color:var(--ink);background:#fff}
.numrow .stp{width:60px;height:60px;border-radius:12px;border:2px solid var(--accent);background:#fff;color:var(--accent);font-size:24px;font-weight:700}
.numrow .unit{font-size:22px;font-weight:700}
.feedback{border-radius:12px;padding:10px 14px;font-size:19px;line-height:2.1}
.feedback.ok{background:var(--ok-weak);border:2px solid var(--ok)}
.feedback.ng{background:var(--ng-weak);border:2px solid var(--ng)}
.feedback .big{font-size:24px;font-weight:700}
.feedback ul{margin:4px 0 0;padding-left:1.2em}
.fig{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.fig .cap{font-size:16px;line-height:2}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* 結果 */
#result{align-items:center;overflow:auto}
.rescard{width:min(640px,100%);box-sizing:border-box;padding:28px 16px;display:flex;flex-direction:column;gap:16px;align-items:center}
.rescard h2{margin:0;font-size:34px;line-height:1.8}
.score{font-size:30px;font-weight:700;line-height:2}
.score .n{font-size:56px;color:var(--accent);font-variant-numeric:tabular-nums}
.reslist{width:100%;display:grid;gap:8px}
.resrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 14px;font-size:18px;line-height:2}
.resrow .no{width:2.2em;font-weight:700;color:var(--sub)}
.resrow .mark{margin-left:auto;font-weight:700;white-space:nowrap}
.resrow .mark.o{color:var(--ok)} .resrow .mark.x{color:var(--ng)}

/* モーダル */
.modal{position:fixed;inset:0;background:rgba(30,40,36,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.mbox{background:var(--panel);border-radius:16px;padding:20px 20px;width:min(620px,100%);max-height:calc(100% - 32px);overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.mbox h3{margin:0;font-size:24px;line-height:1.8}
.mbox p,.mbox li{font-size:19px;line-height:2.1;margin:0}
.mbox ul{margin:0;padding-left:1.2em}
.setrow{display:flex;flex-direction:column;gap:8px}
.setrow .lab{font-size:18px;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:52px;min-width:64px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:18px;font-weight:700;padding:4px 14px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.lvdesc{font-size:15px;color:var(--sub);line-height:1.7}
.chk{display:flex;align-items:center;gap:10px;font-size:18px;line-height:2;min-height:44px}
.chk input{width:28px;height:28px}

/* SVG強調 */
.ring{fill:none;stroke:var(--hl);stroke-width:5}
.harrow{fill:none;stroke:var(--hl);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.harrow2{fill:none;stroke:#1E6A84;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.85;stroke-dasharray:16 10}
.badge circle{fill:var(--hl);stroke:#fff;stroke-width:2}
.badge text{fill:#fff;font-size:18px;font-weight:700;font-family:var(--font)}
.mins circle{fill:#fff;stroke:#333;stroke-width:2}
.mins text{font-size:17px;font-weight:700;font-family:var(--font);fill:#222}
.mins.on circle{stroke:var(--hl);stroke-width:4}

@media (orientation:portrait),(max-width:820px){
  .qmain{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);overflow:hidden}
  #mapbox{flex:none;height:min(50vh,72vw)}
  .qtext{font-size:20px}
}
@media (max-width:520px){
  .qmain{padding:8px}
  .opt{font-size:18px}
  .btn{font-size:20px;padding:6px 18px}
}
</style>
</head>
<body>
<div id="start" class="screen">
  <div class="topright">
    <button class="iconbtn" id="helpBtn" aria-label="つかいかた">？</button>
    <button class="iconbtn" id="gearBtn" aria-label="設定">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="#22302B" stroke-width="2" d="M12 8.5a3.5 3.5 0 1 0 0 7a3.5 3.5 0 1 0 0-7zM19.4 13.5l1.8 1.4-1.8 3.1-2.2-.8a7 7 0 0 1-2 1.2l-.3 2.3h-3.6l-.3-2.3a7 7 0 0 1-2-1.2l-2.2.8-1.8-3.1 1.8-1.4a7 7 0 0 1 0-2.4L2.8 9.7l1.8-3.1 2.2.8a7 7 0 0 1 2-1.2l.3-2.3h3.6l.3 2.3a7 7 0 0 1 2 1.2l2.2-.8 1.8 3.1-1.8 1.4a7 7 0 0 1 0 2.4z"/></svg>設定
    </button>
  </div>
  <div class="startcard">
    <svg class="startillust" viewBox="0 0 420 170" aria-hidden="true">
      <rect width="420" height="170" fill="#FAF9F4" stroke="#9AA59F" stroke-width="2"/>
      <rect x="0" y="16" width="420" height="10" fill="#222"/><rect x="0" y="18.5" width="420" height="5" fill="#fff" stroke-dasharray="20 20"/>
      <line x1="0" y1="21" x2="420" y2="21" stroke="#fff" stroke-width="5" stroke-dasharray="22 22"/>
      <rect x="0" y="52" width="420" height="14" fill="#D3D6D0"/><rect x="0" y="118" width="420" height="14" fill="#D3D6D0"/>
      <rect x="90" y="52" width="14" height="118" fill="#D3D6D0"/><rect x="230" y="52" width="14" height="118" fill="#D3D6D0"/>
      <rect x="97" y="59" width="140" height="66" fill="none" stroke="#1F4E8C" stroke-width="3.5" stroke-dasharray="0.1 8" stroke-linecap="round"/>
      <circle cx="50" cy="92" r="9" fill="#fff" stroke="#222" stroke-width="2.2"/><path d="M45 88h10M45 91h10M50 91v6" stroke="#222" stroke-width="2" fill="none"/>
      <text x="167" y="100" text-anchor="middle" font-size="22" font-weight="700" fill="#222" font-family="BIZ UDPGothic">文</text>
      <circle cx="320" cy="92" r="9" fill="#fff" stroke="#222" stroke-width="2.2"/><circle cx="320" cy="92" r="4.5" fill="none" stroke="#222" stroke-width="2.2"/>
      <g transform="translate(392,92)"><path d="M0 -22 L8 6 L0 1 L-8 6Z" fill="#222"/><text y="20" text-anchor="middle" font-size="13" font-weight="700" font-family="BIZ UDPGothic">N</text></g>
    </svg>
    <h1><ruby>地図<rt>ちず</rt></ruby>を<ruby>読<rt>よ</rt></ruby>もう</h1>
    <p class="lead"><ruby>地図<rt>ちず</rt></ruby>を<ruby>見<rt>み</rt></ruby>て、もんだいにこたえるよ。</p>
    <div class="chips"><span class="chip" id="chipLv"></span><span class="chip" id="chipNum"></span></div>
    <button class="btn primary" id="startBtn" style="min-width:220px;font-size:26px">はじめる</button>
  </div>
</div>

<div id="quiz" class="screen" hidden>
  <header>
    <button class="iconbtn" id="quitBtn">おわる</button>
    <div class="prog" id="prog"></div>
    <span class="chip" id="qLv" style="font-size:16px"></span>
  </header>
  <div class="qmain">
    <div class="mapcol">
      <div id="mapbox">
        <div id="mapsizer">
          <div id="mapscale">
            <svg id="base" width="1000" height="760" viewBox="0 0 1000 760"></svg>
            <div id="labels"></div>
            <svg id="hl" width="1000" height="760" viewBox="0 0 1000 760"></svg>
          </div>
        </div>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<div id="result" class="screen" hidden>
  <div class="rescard">
    <h2>けっか</h2>
    <div class="score" id="score"></div>
    <div class="reslist" id="reslist"></div>
    <div class="actions" style="justify-content:center">
      <button class="btn" id="homeBtn">はじめにもどる</button>
      <button class="btn primary" id="againBtn">もういちど</button>
    </div>
  </div>
</div>

<div class="modal" id="setModal" hidden>
  <div class="mbox" role="dialog" aria-label="設定">
    <h3>設定</h3>
    <div class="setrow">
      <span class="lab">レベル</span>
      <div class="seg" id="segLv"></div>
      <div class="lvdesc" id="lvDesc"></div>
    </div>
    <div class="setrow">
      <span class="lab">問題数</span>
      <div class="numrow">
        <input id="cntIn" inputmode="numeric" aria-label="問題数">
        <button class="stp" id="cntUp" aria-label="ふやす">△</button>
        <button class="stp" id="cntDn" aria-label="へらす">▽</button>
        <span class="unit">問（3〜20）</span>
      </div>
    </div>
    <div class="setrow">
      <span class="lab">効果音</span>
      <div class="seg" id="segSnd"><button data-v="1">ON</button><button data-v="0">OFF</button></div>
    </div>
    <div class="actions"><button class="btn primary" id="setClose">とじる</button></div>
  </div>
</div>

<div class="modal" id="helpModal" hidden>
  <div class="mbox" role="dialog" aria-label="つかいかた">
    <h3>つかいかた</h3>
    <ul>
      <li><ruby>地図<rt>ちず</rt></ruby>を<ruby>見<rt>み</rt></ruby>て、もんだいにこたえるよ。<ruby>上<rt>うえ</rt></ruby>が<ruby>北<rt>きた</rt></ruby>だよ。</li>
      <li>えらぶもんだいは、こたえをえらんで「こたえる」をおしてね。</li>
      <li><ruby>数<rt>かず</rt></ruby>のもんだいは、△▽をおすか、<ruby>数字<rt>すうじ</rt></ruby>を<ruby>入<rt>い</rt></ruby>れてね。</li>
      <li>こたえたあとは、<ruby>地図<rt>ちず</rt></ruby>の<ruby>中<rt>なか</rt></ruby>の<ruby>見<rt>み</rt></ruby>るところに、だいだい<ruby>色<rt>いろ</rt></ruby>のしるしがつくよ。</li>
    </ul>
    <label class="chk"><input type="checkbox" id="hideHelp"><span><ruby>次<rt>つぎ</rt></ruby>からは<ruby>出<rt>だ</rt></ruby>さない</span></label>
    <div class="actions"><button class="btn primary" id="helpClose">とじる</button></div>
  </div>
</div>

<script>
// ===== GEN-START（地図と問題の自動生成：DOMを使わない部分） =====
const R=s=>s.replace(/\{([^|{}]+)\|([^{}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

const W=1000,H=760;
const RX=[40,270,500,730,960], RY=[95,285,475,665], RW=26;
const NC=4,NR=3;
const bcx=c=>(RX[c]+RX[c+1])/2, bcy=r=>(RY[r]+RY[r+1])/2;

const TYPES={
  yubin:{w:'{郵便局|ゆうびんきょく}',sym:'yubin'},
  sho:{w:'{小学校|しょうがっこう}',sym:'school'},
  chu:{w:'{中学校|ちゅうがっこう}',sym:'school'},
  koko:{w:'{高校|こうこう}',sym:'school'},
  byoin:{w:'{病院|びょういん}',sym:'byoin'},
  keisatsu:{w:'{警察署|けいさつしょ}',sym:'keisatsu',solo:true},
  shobo:{w:'{消防署|しょうぼうしょ}',sym:'shobo',solo:true},
  shiyaku:{w:'{市役所|しやくしょ}',sym:'shiyaku',solo:true},
  tosho:{w:'{図書館|としょかん}',sym:'tosho'},
  haku:{w:'{博物館|はくぶつかん}',sym:'haku'},
  ginko:{w:'{銀行|ぎんこう}',sym:'dot'},
  super:{w:'スーパー',sym:'dot'},
  rest:{w:'レストラン',sym:'dot'},
  koen:{w:'{公園|こうえん}',sym:'park'},
  yakkyoku:{w:'{薬局|やっきょく}',sym:'dot'}
};
const SHORTSTOP=['shiyaku','keisatsu','shobo','tosho','haku','byoin','koen'];
const SYMNAME={yubin:'{郵便局|ゆうびんきょく}',school:'{学校|がっこう}',byoin:'{病院|びょういん}',keisatsu:'{警察署|けいさつしょ}',shobo:'{消防署|しょうぼうしょ}',shiyaku:'{市役所|しやくしょ}',tosho:'{図書館|としょかん}',haku:'{博物館|はくぶつかん}',dot:'そのほかの{建物|たてもの}'};
const PREF=['さくら','ひまわり','あおば','つばき','かえで','もみじ','すずらん','あさひ','なのはな','たんぽぽ','わかば','にじ','ゆめ','すみれ','こすもす','ふたば'];
const STPREF=['みどり','そら','ひかり','あおい','はるか','みなと','こだま'];
const CHOME=['もり','おか','やま','かわ','いけ','はら','たに','まつ'];

const DIRV={N:[0,-1],E:[1,0],S:[0,1],W:[-1,0]};
const DN={N:'{北|きた}',E:'{東|ひがし}',S:'{南|みなみ}',W:'{西|にし}'};
const UPDN={N:'{上|うえ}',S:'{下|した}',E:'{右|みぎ}',W:'{左|ひだり}'};
const vecDir=v=>v[0]===0?(v[1]<0?'N':'S'):(v[0]>0?'E':'W');
const leftOf=v=>[v[1],-v[0]], rightOf=v=>[-v[1],v[0]];
const DIR8=['北','北東','東','南東','南','南西','西','北西'];
const DR8YOMI={北:'きた',北東:'ほくとう',東:'ひがし',南東:'なんとう',南:'みなみ',南西:'なんせい',西:'にし',北西:'ほくせい'};
const DR=d=>`{${d}|${DR8YOMI[d]}}`;

function makeFacTypes(){
  const list=[];const add=(t,n)=>{for(let i=0;i<n;i++)list.push(t);};
  add('yubin',2+rnd(2)); add('rest',2); add('ginko',1+rnd(2));
  const singles=shuffle(['sho','chu','koko','byoin','keisatsu','shobo','shiyaku','tosho','haku','super','koen','yakkyoku']);
  while(list.length<11) list.push(singles.pop());
  return shuffle(list);
}
function buildLoop(ya,yb){
  const xa=1,xb=3,s=[];
  for(let i=xa;i<xb;i++) s.push({a:[i,ya],b:[i+1,ya],side:'top',n:[0,-1]});

      let q=null;const order=shuffle(POOL[lv].filter(k=>!used.has(k))).concat(shuffle(POOL[lv]));

}
function answer(){
  const it=Qz.items[Qz.i],q=it.q;let ok,ansText;
  if(q.type==='choice'){ok=Qz.sel===q.ans;ansText=MARK[q.ans]+'　'+R(q.opts[q.ans]);
    $('panel').querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.ans){b.classList.add('right');b.querySelector('.res').textContent='せいかい';}else if(i===Qz.sel){b.classList.add('wrong');b.querySelector('.res').textContent='ちがうよ';}});
  }else{const v=Qz.getv();ok=Math.abs(v-q.ans)<1e-6;ansText=fmt(q.ans,q.dec)+R(q.unit);$('numIn').disabled=true;$('nUp').disabled=true;$('nDn').disabled=true;}
  Qz.done=true;Qz.res.push({ok,cat:q.cat});
  tone(ok?[[784,0.16],[1047,0.28]]:[[392,0.22]]);
  const ex=q.ex;
  $('fb').innerHTML=`<div class="feedback ${ok?'ok':'ng'}"><div class="big">${ok?'○ せいかい！':'△ ざんねん。こたえは「'+ansText+'」だよ。'}</div>${R(ex.t)}${ex.fig?'<div class="fig">'+ex.fig+'</div>':''}${ok?'':'<div>'+R('{地図|ちず}の だいだい{色|いろ}のところを{見|み}てみよう。')+'</div>'}</div>`;
  showHL(ex);
  const b=$('ansBtn');b.disabled=false;b.textContent=Qz.i+1<Qz.items.length?'つぎへ':'けっかを見る';
  if(Qz.i+1>=Qz.items.length)b.innerHTML=R('けっかを{見|み}る');
  setTimeout(()=>{$('fb').scrollIntoView({block:'nearest',behavior:'smooth'});},50);
}
function next(){Qz.i++;if(Qz.i<Qz.items.length)renderQ();else showResult();}
function showResult(){
  const n=Qz.res.filter(r=>r.ok).length;
  $('score').innerHTML=`${Qz.res.length}もん{中|ちゅう} <span class="n">${n}</span>もん せいかい`.replace('{中|ちゅう}','<ruby>中<rt>ちゅう</rt></ruby>');
  $('reslist').innerHTML=Qz.res.map((r,i)=>`<div class="resrow"><span class="no">${i+1}</span><span>${R(r.cat)}</span><span class="mark ${r.ok?'o':'x'}">${r.ok?'○ せいかい':'△ もういちど'}</span></div>`).join('');
  tone([[659,0.14],[784,0.14],[1047,0.3]]);
  show('result');
}

// 設定パネル
function renderSet(){
  $('segLv').innerHTML=[1,2,3,4].map(l=>`<button data-v="${l}" class="${S.level===l?'on':''}">${l}</button>`).join('');
  $('lvDesc').textContent=LVDESC[S.level];
  $('cntIn').value=S.count;
  $('segSnd').querySelectorAll('button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='1')===S.sound));
}
$('segLv').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.level=+b.dataset.v;saveS();renderSet();refreshStart();});
$('segSnd').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.sound=b.dataset.v==='1';saveS();renderSet();});
const setCnt=v=>{S.count=Math.max(3,Math.min(20,v|0));saveS();renderSet();refreshStart();};
$('cntUp').addEventListener('click',()=>setCnt(S.count+1));
$('cntDn').addEventListener('click',()=>setCnt(S.count-1));
$('cntIn').addEventListener('change',()=>{const v=parseInt($('cntIn').value.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)),10);setCnt(isNaN(v)?S.count:v);});
$('gearBtn').addEventListener('click',()=>{renderSet();$('setModal').hidden=false;});
$('setClose').addEventListener('click',()=>{$('setModal').hidden=true;});
$('helpBtn').addEventListener('click',()=>{$('helpModal').hidden=false;});
$('helpClose').addEventListener('click',()=>{try{if($('hideHelp').checked)localStorage.setItem('chizu_hidehelp','1');else localStorage.removeItem('chizu_hidehelp');}catch(e){}$('helpModal').hidden=true;});
$('startBtn').addEventListener('click',()=>{unlockAudio();startQuiz();});
$('quitBtn').addEventListener('click',()=>{refreshStart();show('start');});
$('homeBtn').addEventListener('click',()=>{refreshStart();show('start');});
$('againBtn').addEventListener('click',()=>{unlockAudio();startQuiz();});
window.addEventListener('resize',fitMap);
window.addEventListener('orientationchange',()=>setTimeout(fitMap,200));
if(window.ResizeObserver)new ResizeObserver(fitMap).observe($('mapbox'));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitMap);
refreshStart();
try{if(localStorage.getItem('chizu_hidehelp')!=='1')$('helpModal').hidden=false;else $('hideHelp').checked=true;}catch(e){$('helpModal').hidden=false;}
</script>
</body>
